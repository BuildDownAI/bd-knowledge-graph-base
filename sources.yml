# =============================================================================
# Knowledge-graph ingest sources — the single human-editable manifest.
#
# This file is the one place a person reads to see where the graph's knowledge
# comes from, and edits to point the KG at their project. The defaults below are
# neutral and self-referential so a fresh clone works out of the box:
# `./setup.sh` builds a small graph of THIS repo. Point code_repo at your real
# project (and add trackers) to build a real KG.
# =============================================================================

# ---- IRI namespace (per-deployment identity) --------------------------------
# Every node IRI is minted under this namespace. Convention: https://kg.<org>.dev/
# Changing it after a graph exists changes every IRI — set it once, up front.
namespace: https://example.org/kg/

# ---- ORCHESTRATOR: app whose project list defines this KG's intended scope --
# The bd-kg-refresh skill queries list_projects on this orchestrator's MCP and
# reconciles sources.yml against it. Not consumed by the ingest pipeline itself
# (no MCP calls, no tokens) — this key is for the skills-side reconcile step only.
# orchestrator: https://your-orchestrator.example.com

# ---- PRIMARY: the code repo whose git history + docs seed the graph ---------
code_repo:
  slug: your-org/your-project           # GitHub owner/name (PRs pulled via `gh`)
  path: .                               # local clone, relative to this repo
  # docs_url: https://docs.your-project.example.com  # optional: published documentation root
  doc_globs:                            # semantic-layer source docs (see kg_ingest/semantic.py)
    - docs/solutions/**/*.md            #   frontmatter "solutions"  -> kg:Learning
    - docs/adr/*.md                     #   architecture decisions   -> kg:Decision
    - docs/plans/*.md                   #   implementation plans     -> kg:Decision

# ---- Trackers to ingest (Linear; Jira planned). tier: primary is bound to ---
# ---- code_repo; secondary teams ride along. Requires LINEAR_API_KEY. --------
trackers: []
#  - kind: linear
#    team: PROJ
#    tier: primary

# ---- SELF-INGESTION: fold this KG repo itself into the graph ----------------
# When true, the graph also ingests THIS repo (git spine + docs), so the KG can
# answer questions about its own internals. Recommended once the KG is real.
self_ingest: false

# ---- SECONDARY: related code repos folded into the same graph on request ----
secondary_repos: []
#  - slug: your-org/related-repo
#    path: ../related-repo
#    tier: secondary
#    # docs_url: https://docs.related.example.com  # optional: published documentation root
#
#  Published docs repo (recommended): add the project's documentation repo as a
#  secondary source so the KG can answer "what do the docs promise users?" and
#  ground plans against published behavior (docs-drift detection). Doc pages
#  (.md/.mdx/.rst/.txt) get title+snippet search cards automatically.
#  - slug: your-org/docs
#    path: ../docs
#    tier: secondary
#    # docs_url: https://docs.your-project.example.com

# ---- DOCS SITES: crawl published documentation into the graph (KGB-4/KGB-5) -
# Each entry produces DocSite / DocPage / DocSection spine nodes. Sections get
# individual search cards (type "DocSection") so users can find specific
# passages by meaning. Requires `beautifulsoup4` and `requests` in the venv.
#
# OWN SITE EXAMPLE (with a code-repo link):
# docs_sites:
#  - url: https://docs.your-project.example.com/latest/  # crawl root — pick the version area matching this branch
#    repo: your-org/your-project                          # optional: link site to a code repo node
#    documents_branch: testing                            # optional: code branch this docs version documents
#                                                         #   e.g. /latest/ area -> testing branch; /stable/ -> main
#    max_depth: 4                                         # optional: BFS depth limit (default 4)
#    max_pages: 300                                       # optional: page cap (default 300)
#    include: []                                          # optional: URL path globs to restrict crawl
#    exclude: []                                          # optional: URL path globs to skip
#    delay: 0.5                                           # optional: seconds between requests (default 0.5)
#    user_agent: "KGB-DocBot/1.0"                         # optional: HTTP User-Agent string
#
# THIRD-PARTY SITE EXAMPLE (no repo link; stay polite — honor robots, keep delays, cap pages):
#  - url: https://click.palletsprojects.com/en/stable/    # permissively-crawlable OSS docs
#    max_pages: 50                                        # hard cap for foreign sites
#    delay: 1.0                                           # be a guest: slower than own-site default
#    user_agent: "KGB-DocBot/1.0 (+https://github.com/your-org/your-kg)"

# Proof-of-concept: Click (Pallets) public OSS docs — repo-less third-party entry.
# Demonstrates KGB-5 foreign-site ingest: no repo:, polite delay, hard page cap.
docs_sites:
  - url: https://click.palletsprojects.com/en/stable/
    max_pages: 50
    delay: 1.0
    user_agent: "KGB-DocBot/1.0 (+https://github.com/your-org/your-kg)"
